name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Security Scan & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for agent-redact)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run agent-redact Security Scan
        run: |
          npm ci
          npx agent-redact .

      - name: Setup Java 21 JDK (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Compile and Run Unit/Integration Tests
        working-directory: backend
        run: ./mvnw clean verify

      - name: Upload Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
