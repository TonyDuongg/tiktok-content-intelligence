name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build and verify Windows ZIP
        run: npm run desktop:build
      - name: Create checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem release -Filter 'Creator-Studio-*-Windows-x64.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content "$($archive.FullName).sha256.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Creator-Studio-Windows-x64
          path: |
            release/*.zip
            release/*.sha256.txt
          retention-days: 14
      - name: Publish new release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = "release/Creator-Studio-$version-Windows-x64.zip"
          gh release create "v$version" $archive "$archive.sha256.txt" LICENSE THIRD-PARTY-NOTICES.md --target $env:GITHUB_SHA --title "Creator Studio $version" --notes-file "docs/RELEASE-v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
