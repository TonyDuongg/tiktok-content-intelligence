# Local Development Profile (Runs without Docker using In-Memory H2 DB)
spring:
  datasource:
    url: jdbc:h2:mem:tiktok_intelligence;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console

application:
  aws:
    sqs:
      worker-enabled: false
