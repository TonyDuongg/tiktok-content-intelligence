# Local profile: real providers with a persistent database, without Docker.
spring:
  datasource:
    url: ${LOCAL_DATABASE_URL:jdbc:h2:file:./data/creator-studio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console

application:
  aws:
    sqs:
      worker-enabled: false
