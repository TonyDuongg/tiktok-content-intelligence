server:
  address: 127.0.0.1
  shutdown: graceful
spring:
  datasource:
    url: ${LOCAL_DATABASE_URL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  h2:
    console:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,shutdown
  endpoint:
    shutdown:
      enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    com.tiktok.intelligence: INFO
application:
  aws:
    archive-enabled: false
    sqs:
      worker-enabled: false
