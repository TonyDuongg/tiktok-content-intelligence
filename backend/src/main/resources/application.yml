server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  application:
    name: tiktok-content-intelligence

  jackson:
    deserialization:
      accept-float-as-int: false
    serialization:
      fail-on-empty-beans: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/tiktok_intelligence}
    username: ${SPRING_DATASOURCE_USERNAME:dev_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Swagger / OpenAPI 3 Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.tiktok.intelligence: DEBUG
    org.springframework.web: INFO

application:
  aws:
    archive-enabled: ${S3_ARCHIVE_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-1}
    s3-bucket: ${AWS_S3_BUCKET:tiktok-intelligence-bucket}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    access-key-id: ${AWS_ACCESS_KEY_ID:mock_access_key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:mock_secret_key}
    sqs:
      queue-name: ${AWS_SQS_QUEUE_NAME:tiktok-job-queue}
      dlq-name: ${AWS_SQS_DLQ_NAME:tiktok-job-dlq}
      worker-enabled: ${SQS_WORKER_ENABLED:false}
  scraper:
    provider: ${SCRAPER_PROVIDER:rapidapi}
    rapidapi-key: ${RAPIDAPI_KEY:}
    rapidapi-host: ${RAPIDAPI_HOST:tiktok-scraper7.p.rapidapi.com}
  ai:
    provider: ${AI_PROVIDER:gemini} # gemini, openai, anthropic, xai or bedrock; mocks are test-only
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${ANTHROPIC_MODEL:}
    xai-api-key: ${XAI_API_KEY:}
    xai-model: ${XAI_MODEL:}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash}
    model-id: ${AI_MODEL_ID:anthropic.claude-3-5-sonnet-20240620-v1:0}
    temperature: 0.7
