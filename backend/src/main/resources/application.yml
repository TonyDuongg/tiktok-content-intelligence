server:
  port: 8080

spring:
  application:
    name: tiktok-content-intelligence

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tiktok_intelligence}
    username: ${SPRING_DATASOURCE_USERNAME:dev_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Swagger / OpenAPI 3 Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.tiktok.intelligence: DEBUG
    org.springframework.web: INFO

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours in ms
  aws:
    region: ${AWS_REGION:ap-southeast-1}
    s3-bucket: ${AWS_S3_BUCKET:tiktok-intelligence-bucket}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    access-key-id: ${AWS_ACCESS_KEY_ID:mock_access_key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:mock_secret_key}
    sqs:
      queue-name: ${AWS_SQS_QUEUE_NAME:tiktok-job-queue}
      dlq-name: ${AWS_SQS_DLQ_NAME:tiktok-job-dlq}
      worker-enabled: ${SQS_WORKER_ENABLED:true}
  scraper:
    provider: ${SCRAPER_PROVIDER:mock}
    rapidapi-key: ${RAPIDAPI_KEY:}
    rapidapi-host: ${RAPIDAPI_HOST:tiktok-all-in-one.p.rapidapi.com}


