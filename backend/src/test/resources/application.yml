spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

application:
  aws:
    region: ap-southeast-1
    s3-bucket: test-tiktok-bucket
    endpoint: http://localhost:4566
    access-key-id: test_key
    secret-access-key: test_secret
    sqs:
      queue-name: test-tiktok-job-queue
      dlq-name: test-tiktok-job-dlq
      worker-enabled: false # disable background worker polling during unit tests
  scraper:
    provider: mock
    rapidapi-key: mock_key
    rapidapi-host: tiktok-all-in-one.p.rapidapi.com
  ai:
    provider: mock
    gemini-api-key: ""
    gemini-model: gemini-1.5-flash
    model-id: anthropic.claude-3-5-sonnet-20240620-v1:0
    temperature: 0.7




